name: 'Fact-Checking & Content Verification Pipeline (Spec-Driven)'

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'specs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/verify-sources.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'public/**'
      - 'specs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/verify-sources.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  verify-and-audit:
    name: 'Auditoria de Fatos e Fontes (IA & SecOps)'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v20+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci || npm install

      - name: 🧪 Executar Testes Unitários e de Segurança (Mockados)
        run: npm test

      - name: 🔍 Executar Agente de Validação de Conteúdo
        id: validator
        env:
          TARGET_HTML: 'public/index.html'
          REPORT_OUTPUT: 'dist/verification-report.json'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE || 'https://api.openai.com/v1/chat/completions' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          # Em Pull Requests de forks sem acesso a secrets, ativa fallback semântico resiliente
          MOCK_LLM: ${{ secrets.LLM_API_KEY == '' && 'true' || 'false' }}
        run: |
          node scripts/verify-content.mjs

      - name: 📤 Publicar Relatório de Auditoria como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fact-check-verification-report
          path: dist/verification-report.json
          retention-days: 14

      - name: 💬 Publicar Resumo no Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'dist/verification-report.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const icon = report.verified ? '🟢' : '🔴';
              const statusText = report.verified ? '**MERGE AUTORIZADO**' : '**MERGE BLOQUEADO**';

              let commentBody = `### ${icon} Auditoria do Agente de Fact-Checking: ${statusText}\n\n`;
              commentBody += `> ${report.justification}\n\n`;
              commentBody += `- **Cartões Auditados:** ${report.total_cards_inspected} (Aprovados: ${report.passed_cards} | Reprovados: ${report.failed_cards})\n`;
              commentBody += `- **Índice de Confiança Médio:** ${(report.confidence * 100).toFixed(0)}%\n`;
              commentBody += `- **Links Quebrados / Bloqueados:** ${report.broken_links.length}\n\n`;
              commentBody += `Para ver o detalhamento completo, consulte o **Step Summary** desta execução na aba Actions.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            }

  deploy-pages:
    name: 'Deploy para GitHub Pages'
    needs: verify-and-audit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 📥 Baixar Relatório de Auditoria
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fact-check-verification-report
          path: public/dist/

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Empacotar Artefatos do Site Estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
